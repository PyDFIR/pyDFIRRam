[tool.poetry]
name = "pydfirram"
version = "2.0.0"
description = "Experimental Python toolkit for Volatility-backed memory dump analysis workflows."
authors = [
    "Braguette <alexis.debrito@ecole2600.com>",
    "std3 <67806187+standard3@users.noreply.github.com>",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
]
license = "AGPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
volatility3 = "^2.5.2"
pandas = "^2.2.2"
regex = "^2024.4.28"
loguru = "^0.7.2"
jupyter = { version = "^1.0.0", optional = true }
graphviz = { version = "^0.20.3", optional = true }

[tool.poetry.extras]
jupyter = ["jupyter"]
viz = ["graphviz"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.2"
pytest-cov = "^5.0"
tox = "^4.15"
black = "^24.0"
isort = "^5.13"
flake8 = "^7.0"
flake8-docstrings = "^1.7"
pre-commit = "^3.7"
virtualenv = "^20.26"
twine = "^5.0"
toml = "^0.10.2"
pandas-stubs = "^2.2"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"
mkdocs-git-revision-date-localized-plugin = "^1.2"
mkdocs-git-committers-plugin-2 = "^2.3"
mkdocstrings = "^0.25"
mike = "^1.1.2"

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
